[package]
name = "feedwatch-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Read-only Axum API over Feedwatch's InfluxDB data"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
utoipa = { version = "6", features = ["axum_extras", "preserve_order"] }

[dev-dependencies]
http-body-util = "0.1"
testcontainers = "0.28"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "warn"
